[package]
name = "svx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for secure transfer of Solana validator identity keys"
repository.workspace = true

[[bin]]
name = "svx"
path = "src/main.rs"

[[bin]]
name = "svx-gen-test-identity"
path = "src/bin/gen-test-identity.rs"

[dependencies]
svx-core = { path = "../svx-core" }
